spring.application.name=rep_hub

# deu conflito de portas no meu pc, precisei colocar na 8081
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rephub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

spring.web.error.include-stacktrace=never

api.security.token.secret=${JWT_SECRET:yaTRPtWjHwNex//e4yKa9qLVRibnc+2s0d5uXHvE8A+UeT7ISWmLgnfA7BdQZhFM}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:2}
